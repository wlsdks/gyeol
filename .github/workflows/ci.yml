# 검수: 쓰는 사람 대부분이 윈도우라서, 맥에서 개발하며 놓치기 쉬운 것을 윈도우에서 직접 돌려 본다.
# 1) 세 운영체제 × Node 22(최소 판)와 24에서 타입 검사, 테스트(로컬 서버와 MCP 서버를 실제로 띄우는 것 포함), 빌드, 라이선스.
# 2) 윈도우: 나눠 줄 zip을 만들어 한글과 띄어쓰기가 있는 폴더에 풀고, 안의 시작 .bat로 켜서 엣지와 크롬이 화면을 그리는지 본다.
# 발표 내용이나 업무 자료는 쓰지 않는다(저장소의 지어낸 예시 발표만).

name: 검수

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # main에 올린 것은 끝까지 돌려 어느 커밋에서 깨졌는지 남기고, 고쳐 올리는 PR만 앞의 것을 멈춘다
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: 검사 (${{ matrix.os }}, Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        node: ['22.13', '24']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # 빌드 결과에 허락하지 않은 바깥 주소가 섞이면 멈춘다(pack과 같은 검사)
      - run: node scripts/offline.mjs
      - run: npm run licenses

  windows-package:
    name: 윈도우 배포본 켜 보기
    needs: check
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run pack -- --only windows

      - name: zip을 한글과 띄어쓰기가 있는 폴더에 풀기
        run: |
          $dest = Join-Path $env:RUNNER_TEMP '내 발표 도구'
          Expand-Archive -LiteralPath release/gyeol-windows.zip -DestinationPath $dest
          $app = Get-ChildItem -LiteralPath $dest -Directory | Select-Object -First 1
          "APP=$($app.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Get-ChildItem -LiteralPath $app.FullName | Format-Table Name

      - name: 들어 있어야 할 파일과 줄바꿈, 인코딩
        run: |
          $need = 'Framo 시작.bat', 'node\node.exe', 'dist\index.html', 'dist-node\serve.mjs', 'dist-node\gyeol-mcp.mjs', '사용법.txt'
          foreach ($f in $need) {
            if (-not (Test-Path -LiteralPath (Join-Path $env:APP $f))) { throw "없는 파일: $f" }
          }
          # .bat은 CRLF여야 cmd가 줄을 바르게 읽는다
          $bat = [IO.File]::ReadAllBytes((Join-Path $env:APP 'Framo 시작.bat'))
          $text = [Text.Encoding]::UTF8.GetString($bat)
          if (($text -split "`r`n").Count -lt 10 -or $text -match "[^`r]`n") { throw '.bat 줄바꿈이 CRLF가 아니에요' }
          # 안내 .txt는 메모장이 한글을 바로 읽게 BOM이 있는 UTF-8
          $txt = [IO.File]::ReadAllBytes((Join-Path $env:APP '사용법.txt'))
          if (-not ($txt[0] -eq 0xEF -and $txt[1] -eq 0xBB -and $txt[2] -eq 0xBF)) { throw '사용법.txt에 BOM이 없어요' }
          & (Join-Path $env:APP 'node\node.exe') --version

      - name: 시작 .bat로 켜기
        run: |
          # 브라우저는 열지 않고(GYEOL_NO_OPEN) 서버만 켠다. .bat 이름의 한글은 cmd 인자로 넘길 때 깨질 수 있어 영문 이름으로 복사해 부른다.
          # 실패하면 .bat이 pause로 기다리므로 입력을 비워 둔다
          $env:GYEOL_NO_OPEN = '1'
          Copy-Item -LiteralPath (Join-Path $env:APP 'Framo 시작.bat') -Destination (Join-Path $env:APP 'ci-start.bat')
          $p = Start-Process -FilePath cmd.exe -ArgumentList '/c', 'ci-start.bat < nul' -WorkingDirectory $env:APP -PassThru -Wait -NoNewWindow
          if ($p.ExitCode -ne 0) { throw ".bat이 서버를 켜지 못했어요 (끝 코드 $($p.ExitCode))" }
          $r = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:41580/__html-maker
          if ($r.Content -ne 'html-maker') { throw '서버가 다른 답을 했어요' }
          # 바깥에서 오는 Host는 받지 않는다
          try { Invoke-WebRequest -UseBasicParsing -Headers @{ Host = 'evil.example' } http://127.0.0.1:41580/ | Out-Null; throw 'Host 검사가 꺼져 있어요' } catch { if ($_.Exception.Message -eq 'Host 검사가 꺼져 있어요') { throw } }

      - name: 엣지와 크롬이 화면을 그리는지
        run: |
          $browsers = @{
            '엣지' = 'C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe'
            '크롬' = 'C:\Program Files\Google\Chrome\Application\chrome.exe'
          }
          $pages = @{
            '처음 화면' = @{ url = 'http://127.0.0.1:41580/'; expect = 'Framo' }
            '예시 발표 편집' = @{ url = 'http://127.0.0.1:41580/#/edit/sample'; expect = '발표하기' }
          }
          foreach ($b in $browsers.GetEnumerator()) {
            if (-not (Test-Path -LiteralPath $b.Value)) { Write-Host "$($b.Key)가 없어 건너뛰어요"; continue }
            foreach ($pg in $pages.GetEnumerator()) {
              $profile = Join-Path $env:RUNNER_TEMP "profile-$([guid]::NewGuid())"
              $dom = & $b.Value --headless=new --disable-gpu --no-first-run --no-default-browser-check "--user-data-dir=$profile" --window-size=1280,600 --virtual-time-budget=15000 --dump-dom $pg.Value.url 2>$null | Out-String
              if ($dom -notmatch [regex]::Escape($pg.Value.expect)) {
                Write-Host ($dom.Substring(0, [Math]::Min(2000, $dom.Length)))
                throw "$($b.Key)에서 '$($pg.Key)'가 그려지지 않았어요"
              }
              Write-Host "$($b.Key) / $($pg.Key): 그려짐"
            }
          }

      - name: 서버 끄기
        if: always()
        run: Get-Process node -ErrorAction SilentlyContinue | Stop-Process -Force
