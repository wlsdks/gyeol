# 검수: 쓰는 사람 대부분이 윈도우라서, 맥에서 개발하며 놓치기 쉬운 것을 윈도우에서 직접 돌려 본다.
# 1) 세 운영체제 × Node 22(최소 판)와 24에서 타입 검사, 테스트(로컬 서버와 MCP 서버를 실제로 띄우는 것 포함), 빌드, 라이선스.
# 2) 윈도우: 나눠 줄 zip을 만들어 한글과 띄어쓰기가 있는 폴더에 풀고, Framo.exe로 켜서 엣지와 크롬이 화면을 그리는지 본다.
#    회사 백신이 exe를 막을 때 쓰는 시작 .bat도 켜지는지 본다.
# 발표 내용이나 업무 자료는 쓰지 않는다(저장소의 지어낸 예시 발표만).

name: 검수

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # main에 올린 것은 끝까지 돌려 어느 커밋에서 깨졌는지 남기고, 고쳐 올리는 PR만 앞의 것을 멈춘다
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: 검사 (${{ matrix.os }}, Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        node: ['22.13', '24']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # 빌드 결과에 허락하지 않은 바깥 주소가 섞이면 멈춘다(pack과 같은 검사)
      - run: node scripts/offline.mjs
      - run: npm run licenses

  windows-package:
    name: 윈도우 배포본 켜 보기
    needs: check
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run pack -- --only windows

      - name: zip을 한글과 띄어쓰기가 있는 폴더에 풀기
        run: |
          $dest = Join-Path $env:RUNNER_TEMP '내 발표 도구'
          Expand-Archive -LiteralPath release/gyeol-windows.zip -DestinationPath $dest
          $app = Get-ChildItem -LiteralPath $dest -Directory | Select-Object -First 1
          "APP=$($app.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Get-ChildItem -LiteralPath $app.FullName | Format-Table Name

      - name: 들어 있어야 할 파일과 줄바꿈, 인코딩
        run: |
          $need = 'Framo.exe', 'Framo 시작.bat', 'node\node.exe', 'dist\index.html', 'dist-node\serve.mjs', 'dist-node\gyeol-mcp.mjs', '사용법.txt'
          foreach ($f in $need) {
            if (-not (Test-Path -LiteralPath (Join-Path $env:APP $f))) { throw "없는 파일: $f" }
          }
          # .bat은 CRLF여야 cmd가 줄을 바르게 읽는다
          $bat = [IO.File]::ReadAllBytes((Join-Path $env:APP 'Framo 시작.bat'))
          $text = [Text.Encoding]::UTF8.GetString($bat)
          if (($text -split "`r`n").Count -lt 10 -or $text -match "[^`r]`n") { throw '.bat 줄바꿈이 CRLF가 아니에요' }
          # 안내 .txt는 메모장이 한글을 바로 읽게 BOM이 있는 UTF-8
          $txt = [IO.File]::ReadAllBytes((Join-Path $env:APP '사용법.txt'))
          if (-not ($txt[0] -eq 0xEF -and $txt[1] -eq 0xBB -and $txt[2] -eq 0xBF)) { throw '사용법.txt에 BOM이 없어요' }
          & (Join-Path $env:APP 'node\node.exe') --version

      - name: Framo.exe의 아이콘과 파일 정보
        run: |
          $exe = Get-Item -LiteralPath (Join-Path $env:APP 'Framo.exe')
          $v = node -p "require('./package.json').version"
          $exe.VersionInfo | Format-List FileDescription, ProductName, ProductVersion, FileVersion, OriginalFilename
          if ($exe.VersionInfo.FileDescription -ne 'Framo') { throw "FileDescription이 Framo가 아니에요: $($exe.VersionInfo.FileDescription)" }
          if (-not ($exe.VersionInfo.ProductVersion -like "$v*")) { throw "ProductVersion이 $v 가 아니에요: $($exe.VersionInfo.ProductVersion)" }
          # 서명은 걷어 냈어야 한다(고친 파일에 맞지 않는 서명이 남지 않게)
          $sig = Get-AuthenticodeSignature -LiteralPath $exe.FullName
          "서명: $($sig.Status)"
          if ($sig.Status -ne 'NotSigned') { throw "Framo.exe에 서명이 남아 있어요: $($sig.Status)" }

      - name: 포트를 다른 프로그램이 쓰고 있으면 이유를 보이고 끝나는지
        timeout-minutes: 2
        run: |
          $env:GYEOL_NO_OPEN = '1'
          $l = [System.Net.Sockets.TcpListener]::new([System.Net.IPAddress]::Parse('127.0.0.1'), 41580)
          $l.Start()
          try {
            $in = Join-Path $env:RUNNER_TEMP 'empty.txt'; Set-Content -LiteralPath $in -Value '' -NoNewline
            $out = Join-Path $env:RUNNER_TEMP 'exe-busy-out.txt'; $err = Join-Path $env:RUNNER_TEMP 'exe-busy-err.txt'
            $p = Start-Process -FilePath (Join-Path $env:APP 'Framo.exe') -WorkingDirectory $env:APP -PassThru `
              -RedirectStandardInput $in -RedirectStandardOutput $out -RedirectStandardError $err
            if (-not $p.WaitForExit(30000)) { $p.Kill(); throw 'Framo.exe가 30초 안에 끝나지 않았어요' }
            $msg = Get-Content -LiteralPath $err -Raw -Encoding utf8
            $msg
            if ($p.ExitCode -ne 1) { throw "끝 코드가 1이 아니에요: $($p.ExitCode)" }
            if ($msg -notmatch '41580번 포트') { throw '포트 안내가 보이지 않아요' }
          } finally { $l.Stop() }

      - name: Framo.exe로 켜기
        timeout-minutes: 2
        run: |
          # 브라우저는 열지 않고(GYEOL_NO_OPEN) 서버만 켠다. 더블클릭처럼 새 콘솔 창으로 띄운다(셸 실행이라 이 단계의
          # 출력 통로를 물려받지 않는다). -Wait, -NoNewWindow, 출력 돌리기는 쓰지 않는다: 끝나지 않는 서버가 통로를 붙잡아
          # 단계가 멈출 수 있다. 켜졌는지는 주소로 묻는다
          $env:GYEOL_NO_OPEN = '1'
          $p = Start-Process -FilePath (Join-Path $env:APP 'Framo.exe') -WorkingDirectory $env:APP -PassThru
          "EXE_PID=$($p.Id)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $ok = $false
          for ($i = 0; $i -lt 30 -and -not $ok; $i++) {
            Start-Sleep -Seconds 1
            if ($p.HasExited) { break }
            try { $ok = (Invoke-WebRequest -UseBasicParsing -TimeoutSec 2 http://127.0.0.1:41580/__html-maker).Content -eq 'html-maker' } catch {}
          }
          if (-not $ok) { throw "Framo.exe가 30초 안에 켜지지 않았어요 (끝남: $($p.HasExited), 끝 코드: $(if ($p.HasExited) { $p.ExitCode }))" }
          "Framo.exe가 켜졌어요 (pid $($p.Id))"
          # 바깥에서 오는 Host는 받지 않는다
          try { Invoke-WebRequest -UseBasicParsing -Headers @{ Host = 'evil.example' } http://127.0.0.1:41580/ | Out-Null; throw 'Host 검사가 꺼져 있어요' } catch { if ($_.Exception.Message -eq 'Host 검사가 꺼져 있어요') { throw } }
          # AI(MCP) 서버는 Framo.exe가 아니라 같이 든 node.exe로 띄운다(권한 모델로 다시 띄우는 길을 그대로)
          $ai = Invoke-RestMethod -Headers @{ 'X-HTML-Maker' = '1' } http://127.0.0.1:41580/__html-maker/ai/status
          "nodePath: $($ai.nodePath)"
          "mcpPath: $($ai.mcpPath)"
          if ($ai.nodePath -ne (Join-Path $env:APP 'node\node.exe')) { throw 'MCP 서버를 띄울 node가 node\node.exe가 아니에요' }
          if ($ai.mcpPath -ne (Join-Path $env:APP 'dist-node\gyeol-mcp.mjs')) { throw 'MCP 서버 파일 경로가 달라요' }

      - name: 이미 켜져 있을 때 Framo.exe를 또 누르면 바로 끝나는지
        timeout-minutes: 1
        run: |
          $env:GYEOL_NO_OPEN = '1'
          $in = Join-Path $env:RUNNER_TEMP 'empty.txt'
          $out = Join-Path $env:RUNNER_TEMP 'exe-again-out.txt'; $err = Join-Path $env:RUNNER_TEMP 'exe-again-err.txt'
          $p = Start-Process -FilePath (Join-Path $env:APP 'Framo.exe') -WorkingDirectory $env:APP -PassThru `
            -RedirectStandardInput $in -RedirectStandardOutput $out -RedirectStandardError $err
          if (-not $p.WaitForExit(20000)) { $p.Kill(); throw '두 번째 Framo.exe가 끝나지 않았어요' }
          Get-Content -LiteralPath $out -Raw -Encoding utf8
          if ($p.ExitCode -ne 0) { throw "끝 코드가 0이 아니에요: $($p.ExitCode)" }

      - name: 엣지와 크롬이 화면을 그리는지, 바깥으로 요청하지 않는지 (Framo.exe)
        timeout-minutes: 5
        run: |
          # 이 단계에서만 쓰는 도구라 package.json에 넣지 않는다(Apache-2.0). 설치된 엣지, 크롬을 그대로 쓴다
          npm install --no-save playwright-core@1.64.0
          node scripts/ci-smoke.mjs ci-shots

      - name: Framo.exe 끄기
        timeout-minutes: 1
        run: |
          Stop-Process -Id $env:EXE_PID -Force -ErrorAction SilentlyContinue
          for ($i = 0; $i -lt 20; $i++) {
            try { Invoke-WebRequest -UseBasicParsing -TimeoutSec 1 http://127.0.0.1:41580/__html-maker | Out-Null; Start-Sleep -Seconds 1 } catch { break }
          }

      - name: 시작 .bat로 켜기
        timeout-minutes: 3
        run: |
          # 브라우저는 열지 않고(GYEOL_NO_OPEN) 서버만 켠다. .bat 이름의 한글은 cmd 인자로 넘길 때 깨질 수 있어 영문 이름으로 복사해 부른다.
          # 실패하면 .bat이 pause로 기다리므로 입력을 비워 둔다
          $env:GYEOL_NO_OPEN = '1'
          Copy-Item -LiteralPath (Join-Path $env:APP 'Framo 시작.bat') -Destination (Join-Path $env:APP 'ci-start.bat')
          # -Wait는 .bat이 띄운 서버(자식)까지 기다려 끝나지 않는다. .bat 하나만, 1분까지 기다린다
          $p = Start-Process -FilePath cmd.exe -ArgumentList '/c', 'ci-start.bat < nul' -WorkingDirectory $env:APP -PassThru -NoNewWindow
          if (-not $p.WaitForExit(60000)) { throw '.bat이 1분 안에 끝나지 않았어요' }
          if ($p.ExitCode -ne 0) { throw ".bat이 서버를 켜지 못했어요 (끝 코드 $($p.ExitCode))" }
          $r = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:41580/__html-maker
          if ($r.Content -ne 'html-maker') { throw '서버가 다른 답을 했어요' }
          # 바깥에서 오는 Host는 받지 않는다
          try { Invoke-WebRequest -UseBasicParsing -Headers @{ Host = 'evil.example' } http://127.0.0.1:41580/ | Out-Null; throw 'Host 검사가 꺼져 있어요' } catch { if ($_.Exception.Message -eq 'Host 검사가 꺼져 있어요') { throw } }

      - name: 윈도우에서 찍은 화면 남기기
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-screens
          path: ci-shots
          if-no-files-found: ignore

      - name: 서버 끄기
        if: always()
        run: Get-Process node, Framo -ErrorAction SilentlyContinue | Stop-Process -Force
