# 릴리스: 버전 태그(v0.5.0 같은)를 올리면 검수를 다시 돌리고, 윈도우용과 맥용 zip을 만들어 GitHub 릴리스에 붙인다.
# 앱의 '새 버전' 알림은 이 릴리스(github.com/wlsdks/gyeol)만 보고, zip의 SHA-256(GitHub가 붙이는 digest)을 확인한 뒤에 받는다.
# 올리는 법: package.json의 version을 고치고 커밋한 뒤 `git tag v0.5.0 && git push origin v0.5.0`

name: 릴리스

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    name: 배포본 만들어 올리기
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: 태그와 package.json 버전이 같은지
        run: |
          want="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$want" ]; then echo "태그 $GITHUB_REF_NAME 와 package.json 버전 $want 이 달라요"; exit 1; fi
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run licenses
      - run: npm run pack
      - name: 릴리스 만들기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/gyeol-windows.zip release/gyeol-mac.zip \
            --title "Framo $GITHUB_REF_NAME" --generate-notes --verify-tag
          # 받은 사람이 확인할 수 있게 해시도 적어 둔다 (앱은 GitHub가 붙이는 digest로 확인한다)
          (cd release && sha256sum gyeol-windows.zip gyeol-mac.zip) > SHA256SUMS.txt
          gh release upload "$GITHUB_REF_NAME" SHA256SUMS.txt
