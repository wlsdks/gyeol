# 릴리스: 버전 태그(v0.5.0 같은)를 올리면 검수를 다시 돌리고, 윈도우용과 맥용 zip을 만들어 GitHub 릴리스에 붙인다.
# 앱의 '새 버전' 알림은 이 릴리스(github.com/wlsdks/gyeol)만 보고, zip의 SHA-256(GitHub가 붙이는 digest)을 확인한 뒤에 받는다.
# 윈도우용은 윈도우 러너에서 묶는다: Framo.exe에 아이콘과 파일 정보를 넣는 rcedit가 윈도우 프로그램이다(scripts/exe.mjs).
# 올리는 법: package.json의 version을 고치고 커밋한 뒤 `git tag v0.5.0 && git push origin v0.5.0`

name: 릴리스

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  windows:
    name: 윈도우용 묶기
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run pack -- --only windows
      - name: Framo.exe의 파일 정보
        run: |
          $v = node -p "require('./package.json').version"
          $dir = Get-ChildItem -Path release/windows -Directory | Select-Object -First 1
          $exe = Get-Item -LiteralPath (Join-Path $dir.FullName 'Framo.exe')
          $exe.VersionInfo | Format-List FileDescription, ProductVersion
          if ($exe.VersionInfo.FileDescription -ne 'Framo') { throw 'Framo.exe에 파일 정보가 들어가지 않았어요' }
          if (-not ($exe.VersionInfo.ProductVersion -like "$v*")) { throw "ProductVersion이 $v 가 아니에요" }
      - uses: actions/upload-artifact@v4
        with:
          name: gyeol-windows
          path: release/gyeol-windows.zip
          if-no-files-found: error
          retention-days: 3

  release:
    name: 배포본 만들어 올리기
    needs: windows
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: 태그와 package.json 버전이 같은지
        run: |
          want="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$want" ]; then echo "태그 $GITHUB_REF_NAME 와 package.json 버전 $want 이 달라요"; exit 1; fi
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run licenses
      - run: npm run pack -- --only mac
      - uses: actions/download-artifact@v4
        with:
          name: gyeol-windows
          path: release
      - name: 릴리스 만들기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/gyeol-windows.zip release/gyeol-mac.zip \
            --title "Framo $GITHUB_REF_NAME" --generate-notes --verify-tag
          # 받은 사람이 확인할 수 있게 해시도 적어 둔다 (앱은 GitHub가 붙이는 digest로 확인한다)
          (cd release && sha256sum gyeol-windows.zip gyeol-mac.zip) > SHA256SUMS.txt
          gh release upload "$GITHUB_REF_NAME" SHA256SUMS.txt
